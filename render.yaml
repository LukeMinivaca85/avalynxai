services:
  - type: web
    name: ava-i
    runtime: node
    plan: free
    buildCommand: npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AVA_PUBLIC_URL
        sync: false
        value: "Ava I"